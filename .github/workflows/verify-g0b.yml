name: Verify G0b

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-g0b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Prepare deterministic export fixture
        run: |
          mkdir -p data
          cp tests/fixtures/reference_export_pre_promotion.json data/daily_export.json

      - name: Python tests
        run: python3 -m pytest tests/ -q

      - name: Export fixture validation (G0b CLI)
        run: >-
          python3 scripts/build_daily_export.py
          --validate-existing
          tests/fixtures/reference_export_pre_promotion.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: web-dashboard
        run: npm ci

      - name: Dashboard unit tests
        working-directory: web-dashboard
        run: npm test

      - name: Dashboard production build
        working-directory: web-dashboard
        run: npm run build
